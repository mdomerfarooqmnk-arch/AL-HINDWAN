
name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Fix TypeScript Compatibility
        run: npm install --save-dev --legacy-peer-deps typescript@5.9.3

      - name: Build Web Production Assets
        run: npm run build

      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6

      - name: Create Capacitor Configuration
        run: |
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.mjs
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.alhindwan.travels",
            "appName": "Al-Hindwan Tours",
            "webDir": "dist"
          }
          EOF

      - name: Initialize Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Gradle Execute Permission
        run: chmod +x android/gradlew

      - name: Build Debug Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: al-hindwan-tours-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
