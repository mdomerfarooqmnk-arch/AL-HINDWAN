name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: |
          npm run build

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Android Platform & Sync Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Al-Hindwan Tours" "com.alhindwan.travels" --web-dir dist || true
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Debug Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-hindwan-tours-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
