  <text x="50" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="10" letter-spacing="1" fill="url(#goldFavicon)">AL-HINDWAN</text>
  <text x="50" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="5.5" letter-spacing="1.5" fill="url(#goldFavicon)">TOURS &amp; TRAVELS</text>
</svg>
