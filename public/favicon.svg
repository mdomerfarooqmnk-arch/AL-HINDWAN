<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedb4" />
      <stop offset="35%" stop-color="#dfb75f" />
      <stop offset="70%" stop-color="#c69537" />
      <stop offset="100%" stop-color="#a37421" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#062e22" />
  <circle cx="50" cy="50" r="42" fill="#0d0e10" stroke="url(#goldFavicon)" stroke-width="2.5" />

  <!-- Orbit loop -->
  <ellipse cx="50" cy="42" rx="28" ry="12" fill="none" stroke="url(#goldFavicon)" stroke-width="2.5" stroke-linecap="round" transform="rotate(-26 50 42)" />

  <!-- Airplane -->
  <g transform="translate(38, 26) rotate(-20) scale(0.48)">
    <path d="M 0 -24 L 4 -4 L 32 4 L 32 10 L 4 8 L 2 24 L 14 30 L 14 34 L 0 31 L -14 34 L -14 30 L -2 24 L -4 8 L -32 10 L -32 4 L -4 -4 Z" fill="url(#goldFavicon)" />
  </g>

