<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedb4" />
      <stop offset="25%" stop-color="#dfb75f" />
      <stop offset="50%" stop-color="#c69537" />
      <stop offset="75%" stop-color="#e5be6b" />
      <stop offset="100%" stop-color="#a37421" />
    </linearGradient>

    <linearGradient id="goldStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae7a5" />
      <stop offset="30%" stop-color="#a37624" />
      <stop offset="70%" stop-color="#ecd386" />
      <stop offset="100%" stop-color="#8d621b" />
    </linearGradient>

    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e1e" />
      <stop offset="75%" stop-color="#0b0b0d" />
      <stop offset="100%" stop-color="#050506" />
    </radialGradient>
  </defs>

  <!-- Main Oval Badge -->
  <g>
    <!-- Outer Gold Ring -->
    <ellipse cx="200" cy="100" rx="192" ry="92" fill="none" stroke="url(#goldStrokeGrad)" stroke-width="6" />
    <!-- Dark Badge Interior -->
    <ellipse cx="200" cy="100" rx="188" ry="88" fill="url(#badgeGlow)" />
    <!-- Inner Accent Rim -->
    <ellipse cx="200" cy="100" rx="184" ry="84" fill="none" stroke="url(#goldMetallic)" stroke-width="1.2" opacity="0.6" />
  </g>

  <!-- Golden Airplane with Orbit Loop -->
  <g transform="translate(195, 52)">
    <!-- Orbit loop -->
    <ellipse cx="5" cy="-4" rx="54" ry="20" fill="none" stroke="url(#goldMetallic)" stroke-width="4.2" stroke-linecap="round" transform="rotate(-26 5 -4)" />
    <!-- Secondary loop reflection -->
    <path d="M-36 12 C -20 28, 25 24, 46 2" fill="none" stroke="url(#goldStrokeGrad)" stroke-width="3.2" stroke-linecap="round" opacity="0.85" />
    <!-- Airplane Symbol -->
    <g transform="translate(-16, -10) rotate(-22) scale(0.68)">
      <path d="M 0 -24 L 4 -4 L 32 4 L 32 10 L 4 8 L 2 24 L 14 30 L 14 34 L 0 31 L -14 34 L -14 30 L -2 24 L -4 8 L -32 10 L -32 4 L -4 -4 Z" fill="url(#goldMetallic)" />
    </g>
  </g>

  <!-- Typography -->
  <text x="200" y="138" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" letter-spacing="2.5" fill="url(#goldMetallic)">AL-HINDWAN</text>
  <text x="200" y="166" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="17" letter-spacing="4.5" fill="url(#goldMetallic)">TOURS &amp; TRAVELS</text>
</svg>
